[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages = ["httomolibgpu",
            "httomolibgpu.misc",
            "httomolibgpu.prep",
            "httomolibgpu.recon",
            "httomolibgpu.cuda_kernels"]

[tool.setuptools.package-data]
httomolibgpu = ["*.cu", "*.cuh"]    # include cuda kernels in package

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"

[project]
name = "httomolibgpu"
description = "Commonly used tomography data processing methods at DLS."
readme = "README.rst"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Daniil Kazantsev", email = "daniil.kazantsev@diamond.ac.uk"},
    {name = "Yousef Moazzam", email = "yousef.moazzam@diamond.ac.uk"},
    {name = "Naman Gera", email = "naman.gera@diamond.ac.uk"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Environment :: GPU :: NVIDIA CUDA"
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "cupy==14.2.*",
    "nvtx",
    "numpy==2.4.*",
    "scipy",
    "pillow",
    "scikit-image",
    "tomobar",
    "PyWavelets",
]

[project.optional-dependencies]
validation = ["pytest", "nbmake", "ipykernel", "matplotlib"]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "ruff==0.15.0",
  "black==26.1.0",
  "imageio",
  "h5py",
  "pre-commit==4.5.1",
  "pyfftw",
  "tomophantom"
]


[project.urls]
"Repository" = "https://github.com/DiamondLightSource/httomolibgpu"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
   "-vv",
   "-ra",
   "-q",
   "--tb=native",
   "--cov-report=term",
   "--cov-report=xml:cov.xml",
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::scipy.stats.ConstantInputWarning",
]

[tool.coverage.run]
data_file = "/tmp/httomolibgpu.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = [
    "httomolibgpu",
    "**/site-packages/"
]

[tool.mypy]
# Ignore missing stubs for modules we use
ignore_missing_imports = true

# Black formats Python source files; notebook outputs are preserved.
[tool.black]
line-length = 88
target-version = ["py312"]
required-version = "26.1.0"
include = '\.pyi?$'
force-exclude = '/(build|dist|\.virtual_documents|\.vscode|bin|Zenodo)/'

[tool.ruff]
required-version = "==0.15.0"
target-version = "py312"
line-length = 88
extend-exclude = ["build", "dist", ".virtual_documents", ".vscode", "bin", "Zenodo", "*.ipynb"]
force-exclude = true

[tool.ruff.lint]
# Start with Python errors, unused names and ambiguous or invalid statements.
# Black owns formatting; expand stylistic rules separately.
select = ["F", "E4", "E7", "E9"]
