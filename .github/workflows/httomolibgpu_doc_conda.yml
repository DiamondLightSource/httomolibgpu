name: HTTomolibgpu docs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up documentation environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: httomolibgpu-docs
          environment-file: ./docs/source/doc-conda-requirements.yml
          post-cleanup: all
          init-shell: bash
      - name: Build documentation
        run: bash docs/sphinx-build.sh
      - name: Save built documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish documentation
    needs: build-linux
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: documentation-publish
      cancel-in-progress: false
    steps:
      # Git credentials are only needed in this publishing job.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing tool
        run: python -m pip install ghp-import==2.1.0
      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/build/
      - name: Publish docs
        run: ghp-import -n -p -f ./docs/build
